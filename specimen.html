<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>여백 · Yeobaek — Regular / Bold</title>
  <style>
    @font-face {
      font-family: Yeobaek;
      src: url(Yeobaek-Regular.ttf) format('truetype');
      font-weight: 400;
      font-style: normal;
    }
    @font-face {
      font-family: Yeobaek;
      src: url(Yeobaek-Bold.ttf) format('truetype');
      font-weight: 700;
      font-style: normal;
    }
    body {
      font-family: Yeobaek, serif;
      font-size: 24px;
      line-height: 1.7;
      font-synthesis: none;
      max-width: 960px;
      margin: 40px auto;
      padding: 20px;
    }
    h1 { font-size: 32px; }
  </style>
</head>
<body>
  <h1>여백 · Yeobaek</h1>
  <p>책을 읽는 시간, Reading quietly. 2026년 123,456원.</p>
  <p><strong>책을 읽는 시간, Reading quietly. 2026년 123,456원.</strong></p>
  <p>
    보통 문장 사이에 <strong>한글과 English 강조, 123,456원</strong>를 넣어 확인합니다.
    이 페이지는 가상 Bold 합성을 금지하고 별도 Bold 파일을 지정합니다.
  </p>
  <p>뺨 뚫 꽉 삶 흙 밝 쫓 뿔 붕 뼘 빽 뿜 똠 힣</p>
  <p><strong>뺨 뚫 꽉 삶 흙 밝 쫓 뿔 붕 뼘 빽 뿜 똠 힣</strong></p>
</body>
</html>
